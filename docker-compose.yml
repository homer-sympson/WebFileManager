name: filemanager

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filemanager}
      POSTGRES_USER: ${POSTGRES_USER:-filemanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filemanager}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    # Deliberately no host port: the database only needs to be reachable from the app container on
    # the compose network. Publishing it would collide with the reserved Windows port ranges
    # (Hyper-V/WSL keep 49152-65535 for dynamic allocations, docker then fails with
    # "An attempt was made to access a socket in a way forbidden by its access permissions").
    restart: unless-stopped

  app:
    # An explicit image name keeps Visual Studio container tools predictable.
    image: filemanager-app
    build:
      context: .
      dockerfile: Dockerfile
      # No `target:` on purpose - the last stage (final) is the production image and
      # Visual Studio overrides the target with `base` when it starts a debug session.
    env_file:
      - .env
    environment:
      # Switch to Development (e.g. in .env) for detailed errors while debugging.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      Database__Provider: postgres
      Database__ConnectionString: "Host=db;Port=5432;Database=${POSTGRES_DB:-filemanager};Username=${POSTGRES_USER:-filemanager};Password=${POSTGRES_PASSWORD:-filemanager}"
      Database__MigrateOnStartup: "true"

      # Inside the container the "host" is the container itself.
      FileManager__BrowseRoots__0: /data
      FileManager__BrowseRoots__1: /home
      FileManager__AdminGroups__0: sudo
      FileManager__Auth__ExposeUserList: ${FM_EXPOSE_USER_LIST:-true}
      FileManager__Impersonation__Enabled: ${FM_IMPERSONATION_ENABLED:-true}

      # Used by the entrypoint (requirement 5) and by the in-app bootstrap check.
      FM_BOOTSTRAP_ADMIN_USER: ${FM_BOOTSTRAP_ADMIN_USER:-a-admin}
      FM_BOOTSTRAP_ADMIN_PASSWORD: ${FM_BOOTSTRAP_ADMIN_PASSWORD:-passwordDemand}
      FileManager__Bootstrap__AdminUser: ${FM_BOOTSTRAP_ADMIN_USER:-a-admin}
      FileManager__Bootstrap__AdminPassword: ${FM_BOOTSTRAP_ADMIN_PASSWORD:-passwordDemand}
      FileManager__Bootstrap__GrantSudo: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - fm-data:/data
      - fm-home:/home
    restart: unless-stopped

volumes:
  db-data:
  fm-data:
  fm-home:
